apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  namespace: e2r-supplement-20260925
  labels:
    app.kubernetes.io/part-of: e2r-supplement
spec:
  selector:
    matchLabels:
      app: loadgenerator
  replicas: 1
  template:
    metadata:
      labels:
        app: loadgenerator
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: 'true'
    spec:
      volumes:
      - name: mysql-logs
        emptyDir: {}
      serviceAccountName: e2r-workload
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      initContainers:
      - command:
        - /bin/sh
        - -exc
        - "echo \"Init container pinging frontend: ${FRONTEND_ADDR}...\"\nSTATUSCODE=$(wget\
          \ --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print\
          \ $2}')\nif test $STATUSCODE -ne 200; then\n    echo \"Error: Could not\
          \ reach frontend - Status code: ${STATUSCODE}\"\n    exit 1\nfi\n"
        name: frontend-check
        image: busybox:latest
        env:
        - name: FRONTEND_ADDR
          value: frontend:80
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: main
        image: gcr.m.daocloud.io/google-samples/microservices-demo/loadgenerator:v0.10.1
        env:
        - name: FRONTEND_ADDR
          value: frontend:80
        - name: USERS
          value: '10'
        - name: ENABLE_TRACING
          value: '0'
        - name: COLLECTOR_SERVICE_ADDR
          value: jaeger-collector:4317
        volumeMounts:
        - name: mysql-logs
          mountPath: /var/log/mysql
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 2000Mi
        imagePullPolicy: IfNotPresent
      - name: sidecar-busybox
        image: busybox:1.35
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - sleep 2147483647
        securityContext:
          capabilities:
            add:
            - NET_RAW
        volumeMounts:
        - name: mysql-logs
          mountPath: /var/log/mysql
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi
