    requests.memory: 8Gi
    limits.cpu: '12'
    limits.memory: 30Gi
    pods: '45'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: e2r-supplement-20260925
  labels:
    app.kubernetes.io/part-of: e2r-supplement
spec:
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      volumes:
      - name: mysql-logs
        emptyDir: {}
      serviceAccountName: e2r-workload
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: gcr.m.daocloud.io/google-samples/microservices-demo/emailservice:v0.10.1
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: DISABLE_PROFILER
          value: '1'
        - name: ENABLE_TRACING
          value: '0'
        - name: COLLECTOR_SERVICE_ADDR
          value: jaeger-collector:4317
        - name: OTEL_SERVICE_NAME
          value: emailservice
        readinessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        livenessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        volumeMounts:
        - name: mysql-logs
          mountPath: /var/log/mysql
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 2000Mi
        imagePullPolicy: IfNotPresent
      - name: sidecar-busybox
        image: busybox:1.35
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - sleep 2147483647
        securityContext:
          capabilities:
            add:
            - NET_RAW
        volumeMounts:
        - name: mysql-logs
          mountPath: /var/log/mysql
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
