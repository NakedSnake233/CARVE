---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2r-executor
  namespace: e2r-supplement-20260925
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2r-executor
  namespace: e2r-supplement-20260925
rules:
- apiGroups: ['']
  resources: [pods, services, endpoints, events]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods/log]
  verbs: [get]
- apiGroups: ['']
  resources: [pods/exec]
  verbs: [create]
- apiGroups: ['']
  resources: [pods/portforward]
  verbs: [create]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, patch, update]
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [chaos-mesh.org]
  resources: [stresschaos, networkchaos, podchaos, iochaos]
  verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2r-executor
  namespace: e2r-supplement-20260925
subjects:
- kind: ServiceAccount
  name: e2r-executor
  namespace: e2r-supplement-20260925
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2r-executor
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: e2r-supplement-20260925
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-and-dns
  namespace: e2r-supplement-20260925
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: e2r-quota
  namespace: e2r-supplement-20260925
spec:
  hard:
