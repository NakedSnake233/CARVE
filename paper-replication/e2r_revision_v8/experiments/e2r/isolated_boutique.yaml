apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: e2r-supplement-20260925
  labels:
    app.kubernetes.io/part-of: e2r-supplement
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: 'true'
    spec:
      volumes:
      - name: mysql-logs
        emptyDir: {}
      serviceAccountName: e2r-workload
      containers:
      - name: server
        image: gcr.m.daocloud.io/google-samples/microservices-demo/frontend:v0.10.1
        ports:
        - containerPort: 8080
        readinessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: /_healthz
            port: 8080
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-readiness-probe
        livenessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: /_healthz
            port: 8080
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-liveness-probe
        env:
        - name: PORT
          value: '8080'
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: productcatalogservice:3550
        - name: CURRENCY_SERVICE_ADDR
          value: currencyservice:7000
        - name: CART_SERVICE_ADDR
          value: cartservice:7070
        - name: RECOMMENDATION_SERVICE_ADDR
          value: recommendationservice:8080
        - name: SHIPPING_SERVICE_ADDR
          value: shippingservice:50051
        - name: CHECKOUT_SERVICE_ADDR
          value: checkoutservice:5050
        - name: AD_SERVICE_ADDR
          value: adservice:9555
        - name: DISABLE_PROFILER
          value: '1'
        - name: ENABLE_TRACING
          value: '0'
        - name: COLLECTOR_SERVICE_ADDR
          value: jaeger-collector:4317
        - name: SHOPPING_ASSISTANT_SERVICE_ADDR
          value: shoppingassistantservice:80
        - name: OTEL_SERVICE_NAME
          value: frontend
        volumeMounts:
        - name: mysql-logs
          mountPath: /var/log/mysql
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 2000Mi
        imagePullPolicy: IfNotPresent
      - name: sidecar-busybox
        image: busybox:1.35
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - sleep 2147483647
        securityContext:
          capabilities:
            add:
            - NET_RAW
        volumeMounts:
        - name: mysql-logs
          mountPath: /var/log/mysql
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi
